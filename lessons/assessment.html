<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRL Evaluation Terminal</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        .test-container {
            max-width: 800px;
            margin: 120px auto;
            padding: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .option-btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin: 12px 0;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            color: #ffffff;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
        }
        .option-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-blue);
            padding-left: 25px;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            margin-bottom: 30px;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-blue);
            transition: width 0.3s ease;
        }
        .results-card {
            display: none;
        }
        .breakdown-item {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #ff4a4a;
            border-radius: 0 8px 8px 0;
        }
        .breakdown-item.perfect {
            border-left-color: #4aff4a;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="window.location.href='../index.html'" style="cursor:pointer">RL<span>Space</span></div>
        <nav>
            <a href="../index.html">Home</a>
            <a href="#test" class="active">Knowledge Test</a>
        </nav>
    </header>

    <div class="test-container">
        <!-- Live Quiz Terminal Box -->
        <div id="quiz-box">
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
            <h4 id="question-category" style="color: var(--accent-blue); margin-bottom: 10px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;"></h4>
            <h2 id="question-text" style="margin-bottom: 30px; font-size: 22px;">Loading Evaluation...</h2>
            <div id="options-container"></div>
        </div>

        <!-- Smart Analysis Summary Box (Initially Hidden) -->
        <div id="results-box" class="results-card">
            <h2 style="font-size: 32px; margin-bottom: 10px;">Evaluation Complete</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Review your strategic algorithm metrics summary performance data profile below.</p>
            
            <div style="background: rgba(0, 210, 255, 0.05); padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 30px;">
                <span style="font-size: 14px; color: var(--text-muted); display: block;">FINAL SCORE</span>
                <span id="display-score" style="font-size: 48px; font-weight: bold; color: var(--accent-blue);">0 / 4</span>
            </div>

            <h3 style="margin-bottom: 15px;">Diagnostic Performance Analysis:</h3>
            <div id="breakdown-container"></div>
            
            <button class="btn" onclick="window.location.reload()" style="margin-top: 30px; margin-right: 15px;"><i class="fas fa-redo"></i> Retry Test</button>
            <button class="btn" onclick="window.location.href='../index.html'" style="margin-top: 30px;"><i class="fas fa-home"></i> Main Hub</button>
        </div>
    </div>

    <!-- Isolated Evaluation Architecture Execution Loop -->
    <script>
        const questions = [
            {
                category: "Classic RL",
                q: "What component functions as the value matrix lookup mapping in standard baseline Reinforcement Learning?",
                options: ["Deep Artificial Neural Network Tensor", "Tabular Matrix lookup Q-Table", "Experience Circular Replay Buffer", "Softmax Continuous Distribution Array"],
                correct: 1
            },
            {
                category: "DQN",
                q: "What optimization problem role does the Experience Replay Buffer resolve inside DQN architectures?",
                options: ["It stores parameters values temporarily.", "It removes model overfitting variance layers.", "It breaks temporal data correlations via randomized mini-batch sampling updates.", "It shifts policy state vectors directly."],
                correct: 2
            },
            {
                category: "Policy Gradient",
                q: "Which specific activation layer outputs the categorical probabilistic distribution vectors in standard REINFORCE models?",
                options: ["Rectified Linear Activation Unit (ReLU)", "Continuous Sigmoid Scalar Layer", "Softmax Mathematical Distribution Function", "Hyperbolic Tangent Mapping Vector"],
                correct: 2
            },
            {
                category: "PPO",
                q: "What structural event occurrence does the clipped surrogate objective function shield against in PPO?",
                options: ["Small structural optimization gradient steps", "Destructive, excessively large parameter policy ratio update shifts", "Model memory capacity buffer saturation issues", "Unstable loss exploration weights deviations"],
                correct: 1
            }
        ];

        let currentIndex = 0;
        let pointsScored = 0;
        let mistakesByTopic = { "Classic RL": 0, "DQN": 0, "Policy Gradient": 0, "PPO": 0 };

        function displayQuestion() {
            if (currentIndex >= questions.length) {
                displayDiagnostics();
                return;
            }

            const current = questions[currentIndex];
            document.getElementById("progress").style.width = `${(currentIndex / questions.length) * 100}%`;
            document.getElementById("question-category").innerText = current.category;
            document.getElementById("question-text").innerText = current.q;

            const container = document.getElementById("options-container");
            container.innerHTML = "";

            current.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => evaluateAnswer(idx);
                container.appendChild(btn);
            });
        }

        function evaluateAnswer(selectedIdx) {
            const current = questions[currentIndex];
            if (selectedIdx === current.correct) {
                pointsScored++;
            } else {
                mistakesByTopic[current.category]++;
            }
            currentIndex++;
            displayQuestion();
        }

        function displayDiagnostics() {
            document.getElementById("quiz-box").style.display = "none";
            document.getElementById("results-box").style.display = "block";
            document.getElementById("display-score").innerText = `${pointsScored} / ${questions.length}`;

            const container = document.getElementById("breakdown-container");
            container.innerHTML = "";

            for (const topic in mistakesByTopic) {
                const count = mistakesByTopic[topic];
                const card = document.createElement("div");
                
                if (count > 0) {
                    card.className = "breakdown-item";
                    card.innerHTML = `<strong>${topic}:</strong> Critical gap found. You missed this question. Re-examine the text definitions and canvas diagrams.`;
                } else {
                    card.className = "breakdown-item perfect";
                    card.innerHTML = `<strong>${topic}:</strong> Met criteria perfectly. Core algorithmic principles mastered.`;
                }
                container.appendChild(card);
            }
        }

        // Ignition Step Trigger
        displayQuestion();
    </script>
</body>
</html>
